<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurocross Turkey - İkame Haritası</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for user/lock/arrow icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <!-- Using the local logo -->
                <img src="./Logo.png" alt="Eurocross Turkey" class="logo">
            </div>
            
            <div class="app-title-container">
                <h1 class="app-title">İkame Haritası</h1>
                <!-- Small Turkey Map Icon (SVG) -->
                <svg class="turkey-icon" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#f26522" d="M10.5,23.5 C15.2,20.1 20.3,18.4 28.1,19.2 C35.4,19.9 45.6,15.3 52.8,17.1 C60.1,18.9 66.5,23.1 73.8,22.4 C81.1,21.7 87.4,26.5 90.2,30.1 C93.1,33.8 89.4,38.2 84.1,39.5 C78.8,40.8 70.2,43.1 63.5,41.2 C56.8,39.3 48.5,42.5 41.2,41.8 C33.9,41.1 24.3,44.2 18.1,40.5 C11.9,36.8 5.8,26.9 10.5,23.5 Z"/>
                    <!-- Simplified representation of Turkey map -->
                </svg>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Kullanıcı Bilgisi</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Kullanıcı Adı" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Şifre" required>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Giriş Yap <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="help-link">
                <a href="#">Yardıma mı ihtiyacınız var?</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eurocross Turkey - İkame Haritası</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for user/lock/arrow icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-container">
                <!-- Using the local logo -->
                <img src="./Logo.png" alt="Eurocross Turkey" class="logo">
            </div>
            
            <div class="app-title-container">
                <h1 class="app-title">İkame Haritası</h1>
                <!-- Small Turkey Map Icon (SVG) -->
                <img src="./turkey-map.svg" alt="Türkiye Haritası" class="turkey-icon">
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">Kullanıcı Bilgisi</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="username" placeholder="Kullanıcı Adı" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Şifre" required>
                    </div>
                </div>

                <button type="submit" class="login-button">
                    Giriş Yap <i class="fa-solid fa-arrow-right"></i>
                </button>
                <div id="errorMessage" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 5 seconds Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <img src="./Car.gif" class="car-gif" alt="Araç Yükleniyor...">
        <div class="loading-text">Giriş Başarılı! Yönlendiriliyorsunuz...</div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
